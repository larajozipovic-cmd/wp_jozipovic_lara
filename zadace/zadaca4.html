<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Zadaca 4.</title>

    <style>
        body {
            font-family: Verdana, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 20px 0 60px 0;
            color: #333333;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: auto;
        }

        .card {
            background-color: #87CEEB;
            padding: 24px 24px 48px 24px;
            margin: 20px 0;
            border: 2px solid #333333;
            border-radius: 6px;
            position: relative;
            box-sizing: border-box;
        }

        .card h2 {
            font-family: Arial, sans-serif;
            font-size: 24px;
            margin: 0 0 12px 0;
            text-align: center;
            display: inline-block;
            width: 100%;
        }

        .card table {
            width: 100%;
            border-collapse: collapse;
            font-family: Verdana, sans-serif;
            font-size: 16px;
            color: #333333;
            margin-top: 6px;
        }

        .card table td {
            padding: 8px 6px;
            vertical-align: middle;
        }

        .card table td.label {
            width: 35%;
            font-weight: bold;
            padding-right: 12px;
        }

        .card table td.value {
            width: 65%;
        }

        .more-info {
            position: absolute;
            bottom: 12px;
            right: 16px;
            font-size: 14px;
            background: rgba(255,255,255,0.85);
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid rgba(0,0,0,0.08);
        }

        .more-info a {
            color: #0645AD;
            text-decoration: none;
        }

        .more-info a:hover {
            text-decoration: underline;
        }

       
        .swiss-flag {
            width: 300px;
            height: 300px;
            background-color: #D52B1E;
            position: relative;
            margin: 30px auto;
        }

        .swiss-vertical {
            position: absolute;
            width: 60px;
            height: 180px;
            background-color: #ffffff;
            top: 60px;
            left: 120px;
        }

        .swiss-horizontal {
            position: absolute;
            width: 180px;
            height: 60px;
            background-color: #ffffff;
            top: 120px;
            left: 60px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="card" aria-labelledby="grad1">
        <h2 id="grad1">Informacije o gradu</h2>

        <table aria-label="Podaci o gradu Zagreb">
            <tr>
                <td class="label">Naziv:</td>
                <td class="value">Zagreb</td>
            </tr>
            <tr>
                <td class="label">Država:</td>
                <td class="value">Hrvatska</td>
            </tr>
            <tr>
                <td class="label">Populacija:</td>
                <td class="value">767 131</td>
            </tr>
        </table>

        <div class="more-info">
            <a href="https://hr.wikipedia.org/wiki/Zagreb" target="_blank" rel="noopener">
                Dodatne informacije
            </a>
        </div>
    </div>

    <div class="card" aria-labelledby="grad2">
        <h2 id="grad2">Informacije o gradu</h2>

        <table aria-label="Podaci o gradu Paris">
            <tr>
                <td class="label">Naziv:</td>
                <td class="value">Paris</td>
            </tr>
            <tr>
                <td class="label">Država:</td>
                <td class="value">Francuska</td>
            </tr>
            <tr>
                <td class="label">Populacija:</td>
                <td class="value">2 165 423</td>
            </tr>
        </table>

        <div class="more-info">
            <a href="https://hr.wikipedia.org/wiki/Pariz" target="_blank" rel="noopener">
                Dodatne informacije
            </a>
        </div>
    </div>

    <!-- KARTICA 3 -->
    <div class="card" aria-labelledby="grad3">
        <h2 id="grad3">Informacije o gradu</h2>

        <table aria-label="Podaci o gradu Tokyo">
            <tr>
                <td class="label">Naziv:</td>
                <td class="value">Tokyo</td>
            </tr>
            <tr>
                <td class="label">Država:</td>
                <td class="value">Japan</td>
            </tr>
            <tr>
                <td class="label">Populacija:</td>
                <td class="value">13 960 236</td>
            </tr>
        </table>

        <div class="more-info">
            <a href="https://hr.wikipedia.org/wiki/Tokio" target="_blank" rel="noopener">
                Dodatne informacije
            </a>
        </div>
    </div>

    <h2 style="text-align:center;">Zastava Švicarske</h2>
    <div class="swiss-flag">
        <div class="swiss-vertical"></div>
        <div class="swiss-horizontal"></div>
    </div>

</div>

</body>
</html>
