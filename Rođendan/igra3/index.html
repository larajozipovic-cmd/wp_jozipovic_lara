<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Igra 3 – Memory</title>

<style>
:root{--accent:#f59e0b}

body{
  margin:0;
  height:100vh;
  background:#0f1226;
  color:#fff;
  font-family:Inter,system-ui,Arial;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  background:rgba(0,0,0,.35);
  padding:26px;
  border-radius:18px;
  box-shadow:0 10px 40px rgba(0,0,0,.6);
  text-align:center;
}

h2{margin-top:0}

.grid{
  display:grid;
  grid-template-columns:repeat(4,70px);
  gap:12px;
  margin-top:16px;
  justify-content:center;
}

.tile{
  width:70px;
  height:70px;
  border-radius:12px;
  background:radial-gradient(circle at 30% 30%, #ffd27a, #f08f00);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  cursor:pointer;
  user-select:none;
}

.tile.revealed{
  background:#111827;
}

.tile.done{
  background:#16a34a;
  cursor:default;
}
</style>
</head>

<body>
<div class="card">
  <h2>Igra 3: Memory</h2>
  <p>Pronađi sve parove.</p>

  <div class="grid" id="grid"></div>
</div>

<script>
const symbols = ['🔥','⚡','💛','⭐','🔥','⚡','💛','⭐'];
symbols.sort(()=>Math.random()-0.5);

const grid = document.getElementById('grid');
let first = null;
let lock = false;
let solved = 0;

symbols.forEach(sym=>{
  const tile = document.createElement('div');
  tile.className = 'tile';

  tile.addEventListener('click', ()=>{
    if(lock || tile.classList.contains('done') || tile === first) return;

    tile.textContent = sym;
    tile.classList.add('revealed');

    if(!first){
      first = tile;
    }else{
      lock = true;
      if(first.textContent === tile.textContent){
        first.classList.add('done');
        tile.classList.add('done');
        solved += 2;
        resetTurn();

        if(solved === symbols.length){
          setTimeout(()=>{
            localStorage.setItem('fragment3','✔');
            alert('Bravo, osvojio si fragment!');
            window.close();
          },500);
        }
      }else{
        setTimeout(()=>{
          first.textContent = '';
          tile.textContent = '';
          first.classList.remove('revealed');
          tile.classList.remove('revealed');
          resetTurn();
        },800);
      }
    }
  });

  grid.appendChild(tile);
});

function resetTurn(){
  first = null;
  lock = false;
}
</script>
</body>
</html>
