<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bijeg kroz Snježnu Oluju</title>
<style>
  html, body {
    margin:0; padding:0;
    width:100%; height:100%;
    overflow:hidden;
    background: linear-gradient(#0a1b3c, #051026);
    font-family: sans-serif;
  }
  canvas { display:block; background: transparent; }
  #message, #gameOver {
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:28px;
    text-align:center;
    display:none;
    font-weight:bold;
    text-shadow: 0 0 10px #ff88aa;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="message">🎉 Dobio si fragment pergamenta! ❤️</div>
<div id="gameOver">💀 Oh ne! Umro si lol! Pokušaj ponovno...</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const snowflakes = [];
const icicles = [];
const holes = [];
const PLAYER_WIDTH = 30;
const PLAYER_HEIGHT = 60;
let player = {x:100, y:canvas.height-100, vy:0, vx:0, onGround:true};
let keys = {};
let reachedGirl = false;
let gameOver = false;

// pahulje
for(let i=0;i<80;i++){
  snowflakes.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, r:Math.random()*3+1, speed:Math.random()*2+1});
}
// ledenice - veće i manje u broju
for(let i=0;i<20;i++){
  icicles.push({x:Math.random()*canvas.width, y:Math.random()*-canvas.height, w:20+Math.random()*20, h:40+Math.random()*30, speed:2+Math.random()*2});
}
// rupe
for(let i=1;i<12;i++){
  holes.push({x:i*200+Math.random()*50, width:50+Math.random()*50});
}
// djevojka
const girl = {x:holes[holes.length-1].x+300, y:canvas.height-100, width:30, height:60, glow:0};

// kontrole
document.addEventListener('keydown', e=>keys[e.key]='down');
document.addEventListener('keyup', e=>delete keys[e.key]);

function resetGame(){
  player = {x:100, y:canvas.height-100, vy:0, vx:0, onGround:true};
  reachedGirl = false;
  gameOver = false;
  document.getElementById('gameOver').style.display='none';
  document.getElementById('message').style.display='none';
}

// provjera kolizije s ledenicom
function checkIcicleCollision(){
  for(let ic of icicles){
    if(player.x + PLAYER_WIDTH > ic.x && player.x < ic.x + ic.w &&
       player.y + PLAYER_HEIGHT > ic.y && player.y < ic.y + ic.h){
      gameOver = true;
      document.getElementById('gameOver').style.display='block';
      setTimeout(resetGame, 1500);
    }
  }
}

// provjera kolizije s djevojkom
function checkGirl(){
  if(player.x + PLAYER_WIDTH > girl.x && player.x < girl.x + girl.width &&
     player.y + PLAYER_HEIGHT > girl.y && player.y < girl.y + girl.height &&
     !reachedGirl){
    reachedGirl = true;
    document.getElementById('message').style.display='block';
    localStorage.setItem('fragment1','✔');
    localStorage.setItem('letter1','V');
  }
}

function update(){
  if(gameOver) return;

  // gravitacija
  if(!player.onGround) player.vy += 0.8;
  player.y += player.vy;

  if(player.y >= canvas.height-100){
    player.y = canvas.height-100;
    player.vy=0;
    player.onGround=true;
  }

  // kretanje strelicama
  if(keys['ArrowLeft']) player.x -=5;
  if(keys['ArrowRight']) player.x +=5;
  if(keys['ArrowUp'] && player.onGround){ player.vy=-15; player.onGround=false; }

  // provjera rupa
  for(let h of holes){
    if(player.x+PLAYER_WIDTH>h.x && player.x<h.x+h.width && player.y+PLAYER_HEIGHT >= canvas.height-100){
      player.x -=5;
    }
  }

  checkIcicleCollision();
  checkGirl();

  // pahulje
  for(let f of snowflakes){
    f.y += f.speed;
    if(f.y>canvas.height){ f.y=0; f.x=Math.random()*canvas.width;}
  }

  // ledenice
  for(let ic of icicles){
    ic.y += ic.speed;
    if(ic.y>canvas.height){ ic.y=-50; ic.x=Math.random()*canvas.width;}
  }
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // pahulje
  ctx.fillStyle='white';
  for(let f of snowflakes){ ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fill(); }

  // ledenice
  ctx.fillStyle='aqua';
  for(let ic of icicles){ ctx.fillRect(ic.x, ic.y, ic.w, ic.h); }

  // put
  ctx.fillStyle='#555';
  ctx.fillRect(0,canvas.height-40,canvas.width,40);

  // rupe
  ctx.fillStyle='#0a1b3c';
  for(let h of holes){ ctx.fillRect(h.x, canvas.height-40, h.width, 40); }

  // dječak (realističniji: tijelo + glava)
  ctx.fillStyle='#00ffff';
  ctx.fillRect(player.x, player.y, PLAYER_WIDTH, PLAYER_HEIGHT); // tijelo
  ctx.fillStyle='#00cccc';
  ctx.beginPath();
  ctx.arc(player.x+PLAYER_WIDTH/2, player.y-10, 10, 0, Math.PI*2); // glava
  ctx.fill();

  // djevojka
  girl.glow += 0.05;
  let glowSize = 30 + 10*Math.sin(girl.glow);
  ctx.fillStyle='magenta';
  ctx.beginPath();
  ctx.arc(girl.x+girl.width/2, girl.y+girl.height/2, glowSize, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle='pink';
  ctx.fillRect(girl.x, girl.y, girl.width, girl.height);
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();

window.addEventListener('resize', ()=>{ canvas.width=window.innerWidth; canvas.height=window.innerHeight; });
</script>
</body>
</html>
