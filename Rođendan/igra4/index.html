<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Igra 4 – Posljednji izazov</title>

<style>
body{
  margin:0;
  height:100vh;
  background:#0f1226;
  color:#fff;
  font-family:Inter,system-ui,Arial;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card{
  background:rgba(0,0,0,.4);
  padding:28px;
  border-radius:18px;
  width:360px;
  text-align:center;
}
input{
  width:100%;
  padding:12px;
  margin-top:12px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.1);
  background:transparent;
  color:#fff;
  font-size:18px;
}
button{
  width:100%;
  margin-top:14px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#f59e0b;
  font-weight:800;
  cursor:pointer;
}
.msg{margin-top:12px;color:#ffb4b4}
</style>
</head>

<body>
<div class="card">
  <h2>Posljednji izazov</h2>
  <p id="question">Koja je moja omiljena boja?</p>

  <input id="answer" placeholder="Upiši odgovor">
  <button onclick="check()">Potvrdi</button>
  <div class="msg" id="msg"></div>
</div>

<script>
const questions = [
  { q:'Koja je moja omiljena boja?', a:'žuta' },
  { q:'Koji je moj datum rođenja?', a:'5.10.' },
  { q:'Sushi ili pizza?', a:'sushi' }
];

let current = 0;

function check(){
  const input = document.getElementById('answer').value.trim().toLowerCase();
  const msg = document.getElementById('msg');

  if(input === questions[current].a.toLowerCase()){
    current++;
    if(current < questions.length){
      // iduće pitanje
      document.getElementById('question').textContent = questions[current].q;
      document.getElementById('answer').value = '';
      msg.textContent = '';
    } else {
      // kraj igre – dodaj fragment4
      localStorage.setItem('fragment4','✔');
      alert('Bravo, osvojio si zadnji fragment!');
      window.location.href = '../finale.html';
    }
  } else {
    msg.textContent = 'Nije točan odgovor. Pokušaj ponovno.';
  }
}
</script>
</body>
</html>
