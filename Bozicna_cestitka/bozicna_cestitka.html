<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Božićna igrica Stick Figures</title>
<style>
body { margin:0; background:#012; display:flex; justify-content:center; align-items:center; height:100vh; }
canvas { border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,0.6); background: linear-gradient(#012, #023); }
.hud { position:absolute; top:10px; left:10px; color:#fff; font-weight:600; }
.msg { position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);
       background:rgba(255,255,255,0.95); color:#111; padding:30px 40px; border-radius:15px;
       text-align:center; font-size:24px; display:none; box-shadow:0 10px 30px rgba(0,0,0,0.4);}
.btn { margin-top:15px; padding:8px 16px; border-radius:8px; background:#0a6; color:white; cursor:pointer; font-weight:700; }
</style>
</head>
<body>
<div style="position:relative;">
<canvas id="game" width="900" height="500"></canvas>
<div class="hud" id="hud">Životi: <span id="lives">3</span></div>
<div class="msg" id="message">
  <div id="messageText"></div>
  <div class="btn" id="restartBtn">Igraj ponovno</div>
</div>
</div>

<script>
// --- Setup ---
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let lives = 3;
const maxLives = 3;
let gameOver = false;
let win = false;

const livesEl = document.getElementById('lives');
const messageBox = document.getElementById('message');
const messageText = document.getElementById('messageText');
const restartBtn = document.getElementById('restartBtn');
restartBtn.addEventListener('click', restart);

// --- Player i goal ---
const player = { x:60, y:H-120, speed:3.6, invulnerableUntil:0 };
const girl = { x:W-120, y:H-120 };

// --- Pahuljice ---
const flakes = [];
const flakeConfig = { spawnInterval:350, lastSpawn:0, minSpeed:1.2, maxSpeed:3.6, minSize:6, maxSize:18 };

// --- Kontrole ---
const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

// --- Utility ---
function rand(min,max){ return Math.random()*(max-min)+min; }
function rectsOverlap(a,b){ return !(a.x+28<b.x||a.x>b.x+28||a.y+48<b.y||a.y>b.y+48); }
function circleRectCollide(circle,rect){
  const cx = Math.max(rect.x, Math.min(circle.x, rect.x+28));
  const cy = Math.max(rect.y, Math.min(circle.y, rect.y+48));
  const dx = circle.x - cx; const dy = circle.y - cy;
  return (dx*dx+dy*dy) < circle.r*circle.r;
}

// --- Pahuljica ---
function spawnFlake(){
  const size = rand(flakeConfig.minSize, flakeConfig.maxSize);
  flakes.push({ x: rand(20,W-20), y: -size-10, r:size, speed: rand(flakeConfig.minSpeed, flakeConfig.maxSpeed), sway: rand(0.01,0.07), angle: rand(0,Math.PI*2) });
}

// --- Reset igre ---
function reset(){
  lives = maxLives;
  player.x=60; player.y=H-120;
  flakes.length=0;
  flakeConfig.lastSpawn = performance.now();
  gameOver=false; win=false;
  livesEl.textContent=lives;
  hideMessage();
}
function restart(){ reset(); loop(performance.now()); }
function showMessage(msg){ messageText.innerHTML=msg; messageBox.style.display='block'; }
function hideMessage(){ messageBox.style.display='none'; }

// --- Update ---
function update(dt){
  if(gameOver||win) return;

  let moveX=0, moveY=0;
  if(keys['ArrowLeft']||keys['a']) moveX-=1;
  if(keys['ArrowRight']||keys['d']) moveX+=1;
  if(keys['ArrowUp']||keys['w']) moveY-=1;
  if(keys['ArrowDown']||keys['s']) moveY+=1;
  if(moveX!==0 && moveY!==0){ moveX*=0.7071; moveY*=0.7071; }

  player.x+=moveX*player.speed;
  player.y+=moveY*player.speed;
  player.x = Math.max(6, Math.min(W-28-6, player.x));
  player.y = Math.max(6, Math.min(H-48-6, player.y));

  const now = performance.now();
  if(now - flakeConfig.lastSpawn > flakeConfig.spawnInterval){
    flakeConfig.lastSpawn = now;
    for(let i=0;i<rand(2,5);i++) spawnFlake();
  }

  for(let i=flakes.length-1;i>=0;i--){
    const f=flakes[i];
    f.angle+=f.sway*dt*0.06;
    f.x += Math.sin(f.angle)*0.6;
    f.y += f.speed;
    if(circleRectCollide(f, player) && now > player.invulnerableUntil){
      flakes.splice(i,1);
      lives--;
      livesEl.textContent=lives;
      player.invulnerableUntil = now + 900;
      if(lives<=0){ gameOver=true; showMessage('Game Over 😢'); }
      continue;
    }
    if(f.y - f.r > H+30) flakes.splice(i,1);
  }

  if(rectsOverlap(player, girl)){
    win=true;
    showMessage('Volim te ❤️');
  }
}

// --- Draw ---
function draw(){
  ctx.clearRect(0,0,W,H);
  // background gradient + zvjezdice
  const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#012'); g.addColorStop(1,'#023');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for(let i=0;i<120;i++){ ctx.globalAlpha=0.05; ctx.fillStyle='#fff'; ctx.fillRect((i*73)%W,(i*59)%H,1,1);}
  ctx.globalAlpha=1;

  drawStickFigure(player.x, player.y, 'boy');
  drawStickFigure(girl.x, girl.y, 'girl');

  for(const f of flakes) drawSnowflake(f.x,f.y,f.r);

  ctx.fillStyle='#ddd'; ctx.font='13px sans-serif';
  ctx.fillText('Kontrole: strelice ili WASD • Izbjegavaj pahuljice • Cilj: djevojčica desno',12,H-14);
}

// --- Stick Figure Drawing ---
function drawStickFigure(x,y,type){
  ctx.strokeStyle='#000'; ctx.lineWidth=2;
  // tijelo
  ctx.beginPath(); ctx.moveTo(x+14,y+12); ctx.lineTo(x+14,y+48); ctx.stroke();
  // ruke
  ctx.beginPath(); ctx.moveTo(x+14,y+20); ctx.lineTo(x,y+35); ctx.moveTo(x+14,y+20); ctx.lineTo(x+28,y+35); ctx.stroke();
  // noge
  ctx.beginPath(); ctx.moveTo(x+14,y+48); ctx.lineTo(x,y+68); ctx.moveTo(x+14,y+48); ctx.lineTo(x+28,y+68); ctx.stroke();
  // glava
  ctx.beginPath(); ctx.arc(x+14,y+6,6,0,Math.PI*2); ctx.fillStyle='#ffd7a6'; ctx.fill(); ctx.stroke();
  // kosa
  ctx.fillStyle='#000';
  if(type==='boy'){ for(let i=0;i<6;i++) ctx.fillRect(x+11+i,y-2,1,4); }
  else{ ctx.beginPath(); ctx.moveTo(x+14,y-2); ctx.lineTo(x+22,y-8); ctx.lineTo(x+20,y-2); ctx.fill(); }
  // odjeća
  ctx.fillStyle=type==='boy'?'#8ED6FF':'#FF8C69';
  ctx.beginPath(); ctx.arc(x+14,y+12,4,0,Math.PI*2); ctx.fill(); // jednostavan detalj
}

// --- Draw snowflake ---
function drawSnowflake(x,y,r){
  ctx.save(); ctx.translate(x,y); ctx.rotate((x+y)*0.001);
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(0,0,r*0.4,0,Math.PI*2); ctx.fill();
  for(let i=0;i<6;i++){ ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-r*1.1); ctx.strokeStyle='#fff'; ctx.lineWidth=Math.max(1,r*0.12); ctx.stroke(); ctx.rotate(Math.PI*2/6);}
  ctx.restore();
}

// --- Main loop ---
let last = performance.now();
function loop(now){ const dt=now-last; last=now; update(dt); draw(); if(!gameOver&&!win) requestAnimationFrame(loop);}
reset(); requestAnimationFrame(loop);
</script>
</body>
</html>
