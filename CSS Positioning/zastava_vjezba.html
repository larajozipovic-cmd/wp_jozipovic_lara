<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zastava</title>
    <style>
.red {
width: 500px;
height: 300px;
background-color: red;
position: relative;
}

.blue {
width: 500px;
height: 150px;
background-color: darkblue;
position: absolute;
top: 75px;
}

.circle {
width: 130px;
height: 130px;
border-radius: 360px;
background-color: beige;
position: absolute;
top: 85px;
left: 180px;
}

.plava {
width: 500px;
height: 300px;
background-color: rgb(41, 44, 243);
position: relative;
}

.žuti {
width: 500px;
height: 70px;
background-color: rgb(255, 230, 0);
position: absolute;
top: 120px;
}

.okomiti {
width: 70px;
height: 300px;
background-color: rgb(255, 230, 0);
position: absolute;
left: 150px;
}

    </style>
</head>
<body>
    <h1>Zastava Laosa</h1>

<div class="red">
    <div class="blue"></div>
    <div class="circle"></div>
</div>
<h2>Zastava Švedske</h2>
<div class="plava">
    <div class="žuti"></div>
    <div class="okomiti"></div>
</div>


</body>
</html>
