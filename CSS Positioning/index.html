<!DOCTYPE html>
<html>

<head>
  <title>CSS Positioning Exercise</title>
  <style>
    /* Write your code here */
.blue-box {
  width: 500px;
  height: 300px;
  background-color: rgb(75, 16, 16);
  position: relative;
  top: 200px;
  left: 200px;
}
.red-circle {
  width: 200px;
  height: 200px;
   border-radius: 360px;
  background-color: rgb(159, 184, 103);
  position: absolute;
  top: 150px;
  left: 250px;
}



  </style>
</head>

<body>
  <div class="blue-box">
    <div class="red-circle">
    </div>
  </div>

</body>

</html>
