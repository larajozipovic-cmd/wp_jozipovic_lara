<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position</title>
    <style>
        .relative {
            width: 500px;
            height: 300px;
            border: 1px solid black;
            position: relative;
        }

.prvi {
    width: 200px;
    height: 300px;
    background-color: aquamarine;
    position: absolute;
    left: 150px;
    z-index: 1;
   /*  tko ima veći z indeks on ide naprijed */
}

.drugi {
     width: 200px;
     height: 300px; 
     background-color: rebeccapurple;
     position: absolute;
}

    </style>
</head>
<body>
    <h1>CSS Position</h1>
<div class="relative">
     <div class="prvi"></div>
     <div class="drugi"></div>
</div>



</body>
</html>
